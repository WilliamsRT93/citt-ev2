name: CI/CD CITT - Monorepo

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 332579324003.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ─── Detectar qué componente cambió ───────────────────────────────────────
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      frontend:  ${{ steps.filter.outputs.frontend }}
      ventas:    ${{ steps.filter.outputs.ventas }}
      despachos: ${{ steps.filter.outputs.despachos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            ventas:
              - 'back-ventas/**'
            despachos:
              - 'back-despachos/**'

  # ─── Frontend ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → Build → ECR → EC2
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: citt-frontend
      EC2_INSTANCE_ID: i-0c1f82ee5e125b5eb

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy en EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 332579324003.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 332579324003.dkr.ecr.us-east-1.amazonaws.com/citt-frontend:latest",
              "docker stop citt-frontend 2>/dev/null || true",
              "docker rm citt-frontend 2>/dev/null || true",
              "docker run -d --name citt-frontend --restart unless-stopped -p 80:80 332579324003.dkr.ecr.us-east-1.amazonaws.com/citt-frontend:latest",
              "docker ps | grep citt-frontend"
            ]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
            --query 'CommandInvocations[0].Status' --output text)
          echo "Deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then exit 1; fi

  # ─── Backend Ventas ───────────────────────────────────────────────────────
  deploy-ventas:
    name: Ventas → Build → ECR → EC2
    needs: changes
    if: needs.changes.outputs.ventas == 'true'
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: citt-backend-ventas
      EC2_INSTANCE_ID: i-054cfd2c09a1f2d6a

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen Docker
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./back-ventas/Springboot-API-REST
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy en EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 332579324003.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 332579324003.dkr.ecr.us-east-1.amazonaws.com/citt-backend-ventas:latest",
              "docker stop citt-ventas 2>/dev/null || true",
              "docker rm citt-ventas 2>/dev/null || true",
              "docker run -d --name citt-ventas --restart unless-stopped -p 8080:8080 --memory=400m \
                -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
                -e DB_PORT=3306 \
                -e DB_NAME=citt_ventas \
                -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                332579324003.dkr.ecr.us-east-1.amazonaws.com/citt-backend-ventas:latest",
              "docker ps | grep citt-ventas"
            ]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
            --query 'CommandInvocations[0].Status' --output text)
          echo "Deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then exit 1; fi

  # ─── Backend Despachos ────────────────────────────────────────────────────
  deploy-despachos:
    name: Despachos → Build → ECR → EC2
    needs: changes
    if: needs.changes.outputs.despachos == 'true'
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: citt-backend-despachos
      EC2_INSTANCE_ID: i-0a0f3d9510d8589d3

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen Docker
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./back-despachos/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy en EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 332579324003.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 332579324003.dkr.ecr.us-east-1.amazonaws.com/citt-backend-despachos:latest",
              "docker stop citt-despachos 2>/dev/null || true",
              "docker rm citt-despachos 2>/dev/null || true",
              "docker run -d --name citt-despachos --restart unless-stopped -p 8081:8081 --memory=400m \
                -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
                -e DB_PORT=3306 \
                -e DB_NAME=citt_despachos \
                -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                332579324003.dkr.ecr.us-east-1.amazonaws.com/citt-backend-despachos:latest",
              "docker ps | grep citt-despachos"
            ]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
            --query 'CommandInvocations[0].Status' --output text)
          echo "Deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then exit 1; fi
