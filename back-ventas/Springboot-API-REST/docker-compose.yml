version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: citt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-citt_db}
      MYSQL_USER: ${DB_USERNAME:-citt_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ventas:
    image: ${ECR_VENTAS_URI:-citt-backend-ventas}:${IMAGE_TAG:-latest}
    container_name: citt-ventas
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-citt_db}
      DB_USERNAME: ${DB_USERNAME:-citt_user}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-net

  despachos:
    image: ${ECR_DESPACHOS_URI:-citt-backend-despachos}:${IMAGE_TAG:-latest}
    container_name: citt-despachos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-citt_db}
      DB_USERNAME: ${DB_USERNAME:-citt_user}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-net

volumes:
  mysql-data:
    driver: local

networks:
  backend-net:
    driver: bridge
