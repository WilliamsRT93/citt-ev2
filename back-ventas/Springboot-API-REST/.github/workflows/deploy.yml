name: CI/CD Backend Ventas - ITPCARGO CITT

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: citt-backend-ventas
  ECR_REGISTRY: 332579324003.dkr.ecr.us-east-1.amazonaws.com
  EC2_INSTANCE_ID: i-054cfd2c09a1f2d6a

jobs:
  build-and-deploy:
    name: Build → Push ECR → Deploy EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen Docker (multi-stage, usuario no root)
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./Springboot-API-REST

      - name: Push imagen a ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy en EC2 via AWS SSM (sin SSH)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 332579324003.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 332579324003.dkr.ecr.us-east-1.amazonaws.com/citt-backend-ventas:latest",
              "docker stop innovatech-ventas 2>/dev/null || true",
              "docker rm innovatech-ventas 2>/dev/null || true",
              "docker stop citt-ventas 2>/dev/null || true",
              "docker rm citt-ventas 2>/dev/null || true",
              "docker run -d --name citt-ventas --restart unless-stopped -p 8080:8080 --memory=400m -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} -e DB_PORT=3306 -e DB_NAME=citt_ventas -e DB_USERNAME=${{ secrets.DB_USERNAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} 332579324003.dkr.ecr.us-east-1.amazonaws.com/citt-backend-ventas:latest",
              "docker ps | grep citt-ventas"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query 'CommandInvocations[0].Status' \
            --output text)
          echo "Deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then exit 1; fi
